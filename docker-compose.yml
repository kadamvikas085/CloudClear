services:
  redis:
    image: redis:7-alpine
    container_name: cloudvision-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  ai-service:
    build:
      context: ./ai-service
    container_name: cloudvision-ai-service
    restart: unless-stopped
    env_file:
      - ./ai-service/.env
    ports:
      - "8000:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"
      interval: 15s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    container_name: cloudvision-backend-api
    restart: unless-stopped
    command: node src/server.js
    ports:
      - "5000:5000"
    env_file:
      - ./backend/.env
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      AI_SERVICE_BASE_URL: http://ai-service:8000
    depends_on:
      redis:
        condition: service_healthy
      ai-service:
        condition: service_healthy

  worker:
    build:
      context: ./backend
    container_name: cloudvision-backend-worker
    restart: unless-stopped
    command: node src/worker.js
    ports: []
    env_file:
      - ./backend/.env
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      AI_SERVICE_BASE_URL: http://ai-service:8000
    depends_on:
      redis:
        condition: service_healthy
      ai-service:
        condition: service_healthy

volumes:
  redis_data: