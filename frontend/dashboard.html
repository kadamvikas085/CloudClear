<!-- <!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Dashboard — CloudClear AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#06080F; --panel:#0B1220; --panel-2:#0E1626;
  --line: rgba(232,236,244,0.08); --line-strong: rgba(232,236,244,0.16);
  --text:#E8ECF4; --text-dim: rgba(232,236,244,0.62); --text-faint: rgba(232,236,244,0.38);
  --cyan:#10B3C9; --cyan-bright:#3FD8EE; --violet:#7C6FE0; --violet-bright:#9B8FFF;
  --signal:#4ADE9C; --amber:#E0A23F; --danger:#E06A6A;
  --font-display:'Space Grotesk', sans-serif; --font-body:'Inter', sans-serif; --font-mono:'JetBrains Mono', monospace;
  --radius-md:16px; --radius-lg:20px; --ease:cubic-bezier(.4,0,.2,1);
}
*{ margin:0; padding:0; box-sizing:border-box; }
body{ background:var(--ink); color:var(--text); font-family:var(--font-body); min-height:100vh; }

/* ---------- top nav ---------- */
.topnav{
  display:flex; align-items:center; justify-content:space-between;
  padding:18px 32px; border-bottom:1px solid var(--line);
  position:sticky; top:0; background:rgba(6,8,15,0.85); backdrop-filter:blur(14px); z-index:10;
}
.brand{ display:flex; align-items:center; gap:10px; font-family:var(--font-display); font-weight:700; font-size:18px; }
.brand-mark{ width:28px; height:28px; border-radius:8px; background:conic-gradient(from 180deg, var(--cyan), var(--violet), var(--cyan)); position:relative; }
.brand-mark::after{ content:''; position:absolute; inset:5px; border-radius:5px; background:var(--ink); }
.nav-right{ display:flex; align-items:center; gap:16px; }
.user-chip{ font-size:13.5px; color:var(--text-dim); }
.user-chip strong{ color:var(--text); font-weight:600; }

/* ---------- buttons ---------- */
.btn{ display:inline-flex; align-items:center; gap:8px; padding:10px 20px; border-radius:999px; font-size:14px; font-weight:600; cursor:pointer; border:none; transition:transform .3s var(--ease), box-shadow .3s var(--ease), border-color .3s var(--ease), background .3s var(--ease); }
.btn-ghost{ border:1px solid var(--line-strong); color:var(--text); background:rgba(232,236,244,0.02); }
.btn-ghost:hover{ border-color:var(--cyan-bright); background:rgba(16,179,201,0.07); }
.btn-primary{ background:linear-gradient(135deg, var(--cyan) 0%, var(--violet) 100%); color:#04070D; }
.btn-primary:hover{ transform:translateY(-2px); box-shadow:0 12px 32px -8px rgba(16,179,201,0.5); }
.btn-sm{ padding:8px 16px; font-size:12.5px; }
.btn[disabled]{ opacity:0.5; cursor:not-allowed; transform:none !important; box-shadow:none !important; }

/* ---------- layout ---------- */
.wrap{ max-width:1080px; margin:0 auto; padding:40px 24px 80px; }
.page-head{ margin-bottom:28px; }
.page-head h1{ font-family:var(--font-display); font-size:28px; margin-bottom:6px; }
.page-head p{ color:var(--text-dim); font-size:14.5px; }

.glass{ background:linear-gradient(160deg, rgba(232,236,244,0.045), rgba(232,236,244,0.015)); border:1px solid var(--line); border-radius:var(--radius-lg); }
.card{ padding:28px; margin-bottom:20px; }
.row{ display:flex; justify-content:space-between; padding:11px 0; border-bottom:1px solid var(--line); font-size:14px; }
.row:last-child{ border-bottom:none; }
.row span:first-child{ color:var(--text-dim); }
.eyebrow{ font-family:var(--font-mono); font-size:11px; letter-spacing:0.08em; color:var(--text-faint); margin-bottom:8px; }

/* ---------- upload / reconstruction panel (real pipeline) ---------- */
.demo-shell{ display:grid; grid-template-columns:1fr 1fr; gap:0; overflow:hidden; }
@media (max-width:860px){ .demo-shell{ grid-template-columns:1fr; } }
.demo-panel{ padding:32px; }
.demo-panel + .demo-panel{ border-left:1px solid var(--line); }
@media (max-width:860px){ .demo-panel + .demo-panel{ border-left:none; border-top:1px solid var(--line); } }
.dropzone{ border:1.5px dashed var(--line-strong); border-radius:var(--radius-md); padding:44px 24px; text-align:center; cursor:pointer; transition:border-color .3s, background .3s; }
.dropzone.drag{ border-color:var(--cyan-bright); background:rgba(16,179,201,0.06); }
.dropzone svg{ color:var(--text-faint); margin:0 auto 14px; }
.dropzone .dz-title{ font-size:15px; font-weight:600; margin-bottom:4px; }
.dropzone .dz-sub{ font-size:13px; color:var(--text-faint); }
.demo-steps{ display:flex; flex-direction:column; margin-top:22px; }
.demo-step-row{ display:flex; align-items:center; gap:12px; padding:12px 0; border-bottom:1px solid var(--line); font-size:13.5px; color:var(--text-faint); transition:color .3s; }
.demo-step-row:last-child{ border-bottom:none; }
.demo-step-row .ds-dot{ width:18px; height:18px; border-radius:50%; flex-shrink:0; border:1.5px solid var(--line-strong); display:flex; align-items:center; justify-content:center; transition:border-color .3s, background .3s; }
.demo-step-row.active{ color:var(--text); }
.demo-step-row.active .ds-dot{ border-color:var(--cyan-bright); }
.demo-step-row.active .ds-dot::after{ content:''; width:7px; height:7px; border-radius:50%; background:var(--cyan-bright); animation:pulse-dot 1s ease-in-out infinite; }
.demo-step-row.done{ color:var(--text-dim); }
.demo-step-row.done .ds-dot{ background:var(--signal); border-color:var(--signal); }
.demo-step-row.done .ds-dot::after{ content:'✓'; font-size:10px; color:#04070D; }
@keyframes pulse-dot{ 0%,100%{ opacity:1; } 50%{ opacity:0.3; } }
.progress-track{ margin-top:20px; height:6px; border-radius:99px; background:rgba(232,236,244,0.06); overflow:hidden; }
.progress-fill{ height:100%; width:0%; border-radius:99px; background:linear-gradient(90deg, var(--cyan), var(--violet)); transition:width .4s var(--ease); }
.progress-pct{ margin-top:8px; font-family:var(--font-mono); font-size:11px; color:var(--text-faint); text-align:right; }
.demo-result-box{ height:100%; min-height:280px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; border-radius:var(--radius-md); background:var(--panel-2); border:1px solid var(--line); text-align:center; padding:24px; }
.demo-result-box svg{ color:var(--text-faint); }
.demo-result-box.ready{ background:linear-gradient(160deg, rgba(16,179,201,0.08), rgba(124,111,224,0.06)); border-color:rgba(74,222,156,0.3); }
.demo-result-box.error{ background:rgba(224,106,106,0.06); border-color:rgba(224,106,106,0.35); }
.demo-result-box .dr-title{ font-size:15px; font-weight:600; }
.demo-result-box .dr-sub{ font-size:13px; color:var(--text-faint); max-width:280px; }
.demo-result-box img{ max-width:100%; border-radius:10px; border:1px solid var(--line); }

.notice{ font-size:13px; color:var(--text-faint); line-height:1.6; }
</style>
</head>
<body>

<div class="topnav">
  <div class="brand">
    <span class="brand-mark" aria-hidden="true"></span>
    CloudClear<span style="color:var(--cyan-bright)">AI</span>
  </div>
  <div class="nav-right">
    <span class="user-chip" id="userChip">Checking session…</span>
    <button class="btn btn-ghost btn-sm" id="logoutBtn">Log out</button>
  </div>
</div>

<div class="wrap">
  <div class="page-head">
    <h1 id="greeting">Welcome</h1>
    <p>Upload a LISS-IV scene and run the real reconstruction pipeline against your account.</p>
  </div>

  <div class="glass card" id="accountCard" style="display:none;">
    <p class="eyebrow">ACCOUNT</p>
    <div class="row"><span>Name</span><span id="uName"></span></div>
    <div class="row"><span>Email</span><span id="uEmail"></span></div>
    <div class="row"><span>Role</span><span id="uRole"></span></div>
    <div class="row"><span>Email verified</span><span id="uVerified"></span></div>
  </div>

  <div class="glass demo-shell" id="pipelineCard" style="display:none;">
    <div class="demo-panel">
      <p class="eyebrow">RUN PIPELINE</p>
      <div class="dropzone" id="dropzone" tabindex="0" role="button" aria-label="Upload a satellite image to run reconstruction">
        <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 16V4m0 0L7 9m5-5 5 5M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></svg>
        <div class="dz-title">Drop a satellite image here</div>
        <div class="dz-sub">or click to browse · PNG, JPG, TIF</div>
        <input type="file" id="fileInput" accept="image/*" hidden />
      </div>

      <div class="demo-steps" id="demoSteps">
        <div class="demo-step-row" data-step="0"><span class="ds-dot"></span> Image uploaded</div>
        <div class="demo-step-row" data-step="1"><span class="ds-dot"></span> Sent to backend</div>
        <div class="demo-step-row" data-step="2"><span class="ds-dot"></span> Cloud detection &amp; masking</div>
        <div class="demo-step-row" data-step="3"><span class="ds-dot"></span> AI reconstruction</div>
        <div class="demo-step-row" data-step="4"><span class="ds-dot"></span> Cloud-free output ready</div>
      </div>
      <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
      <div class="progress-pct" id="progressPct">Awaiting upload</div>
    </div>

    <div class="demo-panel">
      <div class="demo-result-box" id="demoResult">
        <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="9" cy="9" r="2"/><path d="m21 15-5-5L5 21"/></svg>
        <div class="dr-title">Result preview</div>
        <div class="dr-sub">Your reconstructed output will appear here after processing completes.</div>
      </div>
    </div>
  </div>

  <div class="glass card">
    <p class="notice" id="footNotice">
      This calls your real backend at <code id="endpointLabel"></code> with your access token —
      no mock timers. If your FastAPI route for reconstruction uses a different path or response
      shape than assumed here, tell me the route and expected JSON and I'll wire it exactly.
    </p>
  </div>
</div>

<script src="config.js"></script>
<script>
  const accessToken = sessionStorage.getItem('accessToken');
  if (!accessToken) {
    window.location.href = 'login.html';
  }

  const RECONSTRUCT_ENDPOINT = `${window.API_BASE_URL}/reconstruct`;
  document.getElementById('endpointLabel').textContent = 'POST ' + RECONSTRUCT_ENDPOINT;

  function logout(){
    fetch(`${window.API_BASE_URL}/auth/logout`, { method:'POST', credentials:'include' })
      .catch(() => {})
      .finally(() => { sessionStorage.clear(); window.location.href = 'login.html'; });
  }
  document.getElementById('logoutBtn').addEventListener('click', logout);

  // ---- load session, then reveal the real dashboard ----
  fetch(`${window.API_BASE_URL}/auth/me`, {
    headers: { 'Authorization': `Bearer ${accessToken}` },
    credentials: 'include',
  })
    .then(res => { if (!res.ok) throw new Error('Session expired'); return res.json(); })
    .then(data => {
      const user = data.data.user;
      document.getElementById('greeting').textContent = `Welcome, ${user.name}`;
      document.getElementById('userChip').innerHTML = `<strong>${user.name}</strong>`;
      document.getElementById('uName').textContent = user.name;
      document.getElementById('uEmail').textContent = user.email;
      document.getElementById('uRole').textContent = user.role;
      document.getElementById('uVerified').textContent = user.isEmailVerified ? 'Yes' : 'No';
      document.getElementById('accountCard').style.display = 'block';
      document.getElementById('pipelineCard').style.display = 'grid';
    })
    .catch(() => {
      sessionStorage.clear();
      window.location.href = 'login.html';
    });

  // ---- real upload + reconstruction pipeline ----
  const dropzone = document.getElementById('dropzone');
  const fileInput = document.getElementById('fileInput');
  const progressFill = document.getElementById('progressFill');
  const progressPct = document.getElementById('progressPct');
  const stepRows = document.querySelectorAll('.demo-step-row');
  const resultBox = document.getElementById('demoResult');
  let running = false;

  dropzone.addEventListener('click', () => { if (!running) fileInput.click(); });
  dropzone.addEventListener('keydown', (e) => {
    if ((e.key === 'Enter' || e.key === ' ') && !running) { e.preventDefault(); fileInput.click(); }
  });
  ['dragenter','dragover'].forEach(evt => dropzone.addEventListener(evt, e => { e.preventDefault(); dropzone.classList.add('drag'); }));
  ['dragleave','drop'].forEach(evt => dropzone.addEventListener(evt, e => { e.preventDefault(); dropzone.classList.remove('drag'); }));
  dropzone.addEventListener('drop', e => {
    if (running) return;
    const files = e.dataTransfer.files;
    if (files && files.length) runReconstruction(files[0]);
  });
  fileInput.addEventListener('change', () => {
    if (running) return;
    if (fileInput.files && fileInput.files.length) runReconstruction(fileInput.files[0]);
  });

  function setStep(idx, state){
    stepRows.forEach(row => {
      const rowIdx = parseInt(row.getAttribute('data-step'), 10);
      row.classList.remove('active','done');
      if (rowIdx < idx) row.classList.add('done');
      else if (rowIdx === idx) row.classList.add(state);
    });
  }

  function setProgress(pct, label){
    progressFill.style.width = pct + '%';
    progressPct.textContent = pct + '% — ' + label;
  }

  async function runReconstruction(file){
    running = true;
    dropzone.querySelector('.dz-title').textContent = file.name;
    dropzone.querySelector('.dz-sub').textContent = 'Uploading…';
    resultBox.classList.remove('ready','error');
    resultBox.innerHTML = '<svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="9" cy="9" r="2"/><path d="m21 15-5-5L5 21"/></svg><div class="dr-title">Processing…</div><div class="dr-sub">Waiting on the backend pipeline.</div>';

    setStep(0, 'active');
    setProgress(10, 'Image uploaded');

    try {
      const formData = new FormData();
      formData.append('image', file);

      setStep(1, 'active');
      setProgress(25, 'Sending to backend');

      const res = await fetch(RECONSTRUCT_ENDPOINT, {
        method: 'POST',
        headers: { 'Authorization': `Bearer ${accessToken}` },
        credentials: 'include',
        body: formData,
      });

      setStep(2, 'active');
      setProgress(55, 'Cloud detection & masking');

      const contentType = res.headers.get('content-type') || '';
      let payload = null;
      if (contentType.includes('application/json')) {
        payload = await res.json();
      }

      if (!res.ok) {
        throw new Error((payload && payload.message) || `Request failed (${res.status})`);
      }

      setStep(3, 'active');
      setProgress(80, 'AI reconstruction');

      // Assumed response shape: { data: { resultUrl, maskUrl? } }
      // Adjust this block to match your actual FastAPI response.
      let resultUrl = payload && payload.data && (payload.data.resultUrl || payload.data.result_url);

      if (!resultUrl && contentType.startsWith('image/')) {
        const blob = await res.blob();
        resultUrl = URL.createObjectURL(blob);
      }

      setStep(4, 'done');
      setProgress(100, 'Reconstruction complete');

      resultBox.classList.add('ready');
      if (resultUrl) {
        resultBox.innerHTML = `<img src="${resultUrl}" alt="Reconstructed output" />
          <a class="btn btn-ghost btn-sm" href="${resultUrl}" download style="margin-top:6px;">Download result</a>`;
      } else {
        resultBox.innerHTML = '<svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" style="color:var(--signal);"><path d="M5 13l4 4L19 7"/></svg><div class="dr-title">Reconstruction complete</div><div class="dr-sub">Backend accepted the job but returned no result URL — check the response shape.</div>';
      }

      dropzone.querySelector('.dz-title').textContent = 'Drop another satellite image';
      dropzone.querySelector('.dz-sub').textContent = 'or click to browse · PNG, JPG, TIF';
    } catch (err) {
      resultBox.classList.add('error');
      resultBox.innerHTML = `<svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" style="color:var(--danger);"><circle cx="12" cy="12" r="10"/><path d="M12 8v5m0 3h.01"/></svg><div class="dr-title">Reconstruction failed</div><div class="dr-sub">${err.message}</div>`;
      setProgress(0, 'Failed');
      dropzone.querySelector('.dz-title').textContent = 'Try another image';
      dropzone.querySelector('.dz-sub').textContent = 'or click to browse · PNG, JPG, TIF';
    } finally {
      // running = false;
    }
  }
</script>
</body>
</html> -->
