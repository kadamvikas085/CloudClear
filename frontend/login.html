<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Log In — CloudClear AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="auth-shared.css">
</head>
<body>

<main class="auth-card">
  <a href="index.html" class="back-link">&larr; Back to home</a>
  <div class="auth-brand">
    <span class="brand-mark" aria-hidden="true"></span>
    CloudClear<span class="ai">AI</span>
  </div>
  <h1>Log in</h1>
  <p class="auth-sub">Access your projects, uploads, and reconstruction history.</p>

  <div class="msg" id="notice" role="status"></div>

  <form id="loginForm" novalidate>
    <div class="form-row">
      <label for="email">Email</label>
      <input type="email" id="email" name="email" required autocomplete="email" placeholder="you@example.com" />
    </div>
    <div class="form-row">
      <label for="password">Password</label>
      <input type="password" id="password" name="password" required autocomplete="current-password" placeholder="Your password" />
    </div>
    <button type="submit" class="btn-submit" id="submitBtn">Log in</button>
    <div class="msg" id="msg" role="alert"></div>
  </form>

  <div class="auth-footer">
    Don't have an account? <a href="register.html">Sign up</a>
  </div>
</main>

<script src="config.js"></script>
<script type="module" src="js/auth-page.js"></script>
</body>
</html>
