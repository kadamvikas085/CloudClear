<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Log In — CloudClear AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="auth-shared.css">
</head>
<body>

<div class="auth-card">
  <a href="index.html" class="back-link">&larr; Back to home</a>
  <div class="auth-brand">
    <span class="brand-mark" aria-hidden="true"></span>
    CloudClear<span style="color:var(--cyan-bright)">AI</span>
  </div>
  <h1>Log in</h1>
  <p class="auth-sub">Access your projects, uploads, and reconstruction history.</p>

  <form id="loginForm">
    <div class="form-row">
      <label for="email">Email</label>
      <input type="email" id="email" required placeholder="you@example.com" />
    </div>
    <div class="form-row">
      <label for="password">Password</label>
      <input type="password" id="password" required placeholder="Your password" />
    </div>
    <button type="submit" class="btn-submit" id="submitBtn">Log in</button>
    <div class="msg" id="msg"></div>
  </form>

  <div class="auth-footer">
    Don't have an account? <a href="register.html">Sign up</a>
  </div>
</div>

<script src="config.js"></script>
<script>
  const form = document.getElementById('loginForm');
  const msg = document.getElementById('msg');
  const submitBtn = document.getElementById('submitBtn');

  function showMessage(text, type){
    msg.textContent = text;
    msg.className = 'msg ' + type;
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    submitBtn.disabled = true;
    submitBtn.textContent = 'Logging in...';
    msg.className = 'msg';

    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;

    try {
      const res = await fetch(`${window.API_BASE_URL}/auth/login`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        credentials: 'include',
        body: JSON.stringify({ email, password }),
      });
      const data = await res.json();

      if (!res.ok) {
        throw new Error(data.message || 'Login failed');
      }

      sessionStorage.setItem('accessToken', data.data.accessToken);
      sessionStorage.setItem('user', JSON.stringify(data.data.user));

      showMessage('Login successful! Redirecting...', 'success');
      setTimeout(() => { window.location.href = 'dashboard.html'; }, 800);
    } catch (err) {
      showMessage(err.message || 'Something went wrong. Is the backend running?', 'error');
    } finally {
      submitBtn.disabled = false;
      submitBtn.textContent = 'Log in';
    }
  });
</script>
</body>
</html>
