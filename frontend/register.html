<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sign Up — CloudClear AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="auth-shared.css">
</head>
<body>

<main class="auth-card">
  <a href="index.html" class="back-link">&larr; Back to home</a>
  <div class="auth-brand">
    <span class="brand-mark" aria-hidden="true"></span>
    CloudClear<span class="ai">AI</span>
  </div>
  <h1>Create your account</h1>
  <p class="auth-sub">Sign up to upload imagery and run reconstructions.</p>

  <form id="registerForm" novalidate>
    <div class="form-row">
      <label for="name">Full name</label>
      <input type="text" id="name" name="name" required minlength="2" maxlength="100" autocomplete="name" placeholder="Your full name" />
    </div>
    <div class="form-row">
      <label for="email">Email</label>
      <input type="email" id="email" name="email" required autocomplete="email" placeholder="you@example.com" />
    </div>
    <div class="form-row">
      <label for="password">Password</label>
      <input type="password" id="password" name="password" required minlength="8" autocomplete="new-password" aria-describedby="pwHint" placeholder="At least 8 characters" />
      <p class="field-hint" id="pwHint">At least 8 characters, with at least one letter and one number.</p>
    </div>
    <button type="submit" class="btn-submit" id="submitBtn">Create account</button>
    <div class="msg" id="msg" role="alert"></div>
  </form>

  <div class="auth-footer">
    Already have an account? <a href="login.html">Log in</a>
  </div>
</main>

<script src="config.js"></script>
<script type="module" src="js/auth-page.js"></script>
</body>
</html>
