<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sign Up — CloudClear AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="auth-shared.css">
</head>
<body>

<div class="auth-card">
  <a href="index.html" class="back-link">&larr; Back to home</a>
  <div class="auth-brand">
    <span class="brand-mark" aria-hidden="true"></span>
    CloudClear<span style="color:var(--cyan-bright)">AI</span>
  </div>
  <h1>Create your account</h1>
  <p class="auth-sub">Sign up to upload imagery and run reconstructions.</p>

  <form id="registerForm">
    <div class="form-row">
      <label for="name">Full name</label>
      <input type="text" id="name" required minlength="2" maxlength="100" placeholder="Your full name" />
    </div>
    <div class="form-row">
      <label for="email">Email</label>
      <input type="email" id="email" required placeholder="you@example.com" />
    </div>
    <div class="form-row">
      <label for="password">Password</label>
      <input type="password" id="password" required minlength="8" placeholder="At least 8 characters, 1 letter + 1 number" />
    </div>
    <button type="submit" class="btn-submit" id="submitBtn">Create account</button>
    <div class="msg" id="msg"></div>
  </form>

  <div class="auth-footer">
    Already have an account? <a href="login.html">Log in</a>
  </div>
</div>

<script src="config.js"></script>
<script>
  const form = document.getElementById('registerForm');
  const msg = document.getElementById('msg');
  const submitBtn = document.getElementById('submitBtn');

  function showMessage(text, type){
    msg.textContent = text;
    msg.className = 'msg ' + type;
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    submitBtn.disabled = true;
    submitBtn.textContent = 'Creating account...';
    msg.className = 'msg';

    const name = document.getElementById('name').value.trim();
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;

    try {
      const res = await fetch(`${window.API_BASE_URL}/auth/register`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        credentials: 'include',
        body: JSON.stringify({ name, email, password }),
      });
      const data = await res.json();

      if (!res.ok) {
        throw new Error(data.message || 'Registration failed');
      }

      showMessage('Account created! Check your email to verify, then log in.', 'success');
      form.reset();
      setTimeout(() => { window.location.href = 'login.html'; }, 1800);
    } catch (err) {
      showMessage(err.message || 'Something went wrong. Is the backend running?', 'error');
    } finally {
      submitBtn.disabled = false;
      submitBtn.textContent = 'Create account';
    }
  });
</script>
</body>
</html>
